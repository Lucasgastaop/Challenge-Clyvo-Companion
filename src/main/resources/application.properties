spring.application.name=clyvo-companion

# Perfil padrao: Oracle (ajuste com suas credenciais FIAP)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:oracle}

# Render injeta PORT; local continua em 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# JPA — o schema é versionado pelo Flyway
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Formulários Thymeleaf (datetime-local)
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm

# Paginacao (Spring Data)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cache em memoria (requisito do challenge)
spring.cache.type=simple
